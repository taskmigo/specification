---
name: Temporary complete SRS formatter

on:
  push:
    branches:
      - docs/rewrite-all-srs-module-contracts-20261110

permissions:
  contents: write

jobs:
  format-srs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version-file: package.json
          cache: npm
      - run: npm ci
      - name: Format all rewritten specification documents
        run: |
          npm run style:fix
          git add specification/
          if ! git diff --cached --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -m "style(srs): format all rewritten specifications"
            git push origin "HEAD:refs/heads/docs/rewrite-all-srs-module-contracts-20261110"
          fi
