name: Release

on:
  workflow_dispatch:

jobs:
  quality-gate:
    name: Verification
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - uses: actions/setup-node@v7.0.0
        with:
          node-version-file: package.json
          cache: npm

      - run: npm ci

      - run: npm run style:check

      - run: npm run markdown:check

  release:
    runs-on: ubuntu-latest
    needs:
      - quality-gate
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0

      - name: Read version from package.json
        id: package_version
        run: |
          VERSION=$(node -p "require('./package.json').version")

          echo "version=$VERSION" >> $GITHUB_OUTPUT

      - name: Verify tag uniqueness
        run: |
          TAG_NAME="v${{ steps.package_version.outputs.version }}"

          git fetch --tags

          if git rev-parse "$TAG_NAME" >/dev/null 2>&1; then
            echo "Error: Tag $TAG_NAME already exists in the repository."
            exit 1
          fi

      - name: Find previous release tag
        id: previous_release
        run: |
          TAG_NAME="v${{ steps.package_version.outputs.version }}"
          PREVIOUS_TAG=$(git tag --list 'v*' --sort=-version:refname | grep -Fxv "$TAG_NAME" | head -n 1 || true)

          echo "tag=$PREVIOUS_TAG" >> "$GITHUB_OUTPUT"

      - name: Generate release notes
        env:
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_SERVER_URL: ${{ github.server_url }}
        run: |
          node .github/scripts/generate-release-notes.mjs \
            "${{ steps.previous_release.outputs.tag }}" \
            "$GITHUB_SHA" \
            "$RUNNER_TEMP/release-notes.md"

      - name: Create GitHub Release with gh CLI
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION="${{ steps.package_version.outputs.version }}"
          TAG_NAME="v${VERSION}"

          if [[ "$VERSION" =~ - ]]; then
            echo "Detected pre-release version: $VERSION"

            gh release create "$TAG_NAME" \
              --title "$TAG_NAME" \
              --notes-file "$RUNNER_TEMP/release-notes.md" \
              --target "$GITHUB_SHA" \
              --prerelease
          else
            echo "Detected full release version: $VERSION"

            gh release create "$TAG_NAME" \
              --title "$TAG_NAME" \
              --notes-file "$RUNNER_TEMP/release-notes.md" \
              --target "$GITHUB_SHA"
          fi
